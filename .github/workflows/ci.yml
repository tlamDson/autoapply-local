name: offline-release-checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install setuptools==84.1.0 wheel==0.48.0 build==1.3.0 -r requirements.txt
      - name: Export a clean source tree into a new directory
        run: |
          export_root="$RUNNER_TEMP/autoapply-source-${{ matrix.python }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          artifact_root="$RUNNER_TEMP/autoapply-artifacts-${{ matrix.python }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/check_release.py --export "$export_root"
          mkdir "$artifact_root"
          echo "AUTOAPPLY_EXPORT=$export_root" >> "$GITHUB_ENV"
          echo "AUTOAPPLY_ARTIFACTS=$artifact_root" >> "$GITHUB_ENV"
      - name: Test and audit the exported source
        run: |
          cd "$AUTOAPPLY_EXPORT"
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/adapters.test.cjs
          python scripts/check_release.py
      - name: Build and audit current wheel, sdist and source ZIP
        run: |
          cd "$AUTOAPPLY_EXPORT"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$AUTOAPPLY_ARTIFACTS" .
          python -m build --sdist --no-isolation --outdir "$AUTOAPPLY_ARTIFACTS"
          python scripts/check_release.py --source-zip "$AUTOAPPLY_ARTIFACTS"
          python scripts/check_release.py --artifacts "$AUTOAPPLY_ARTIFACTS" --expect wheel,sdist,zip
      - name: Install final artifacts in isolated Unicode directories
        run: |
          cd "$AUTOAPPLY_EXPORT"
          python scripts/check_install.py --artifacts "$AUTOAPPLY_ARTIFACTS" --work-dir "$RUNNER_TEMP/install thử ünïcode $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
